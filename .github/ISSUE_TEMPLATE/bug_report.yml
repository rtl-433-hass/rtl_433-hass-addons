name: Report an issue with the rtl_433 Home Assistant add-ons
description: Report an issue with the Home Assistant add-on itself.
body:
  - type: markdown
    attributes:
      value: |
        This issue form is for reporting bugs in the add-on only!

        Before reporting a bug, please check:

        1. The add-on log shows one `Radio <id> -> HTTP port <port>` line for each
           dongle you expect the add-on to use.
        2. Turning on the `log_received_messages` add-on option makes decoded
           sensor events appear in the add-on log.

        If the add-on decodes your sensors but Home Assistant does not show the
        devices or entities you expect, report that against the companion
        [rtl_433 integration](https://github.com/rtl-433-hass/rtl_433/issues)
        instead.

  - type: textarea
    validations:
      required: true
    attributes:
      label: The problem
      description: >-
        Describe the issue you are experiencing here, to communicate to the
        maintainers. Tell us what you were trying to do and what happened.

        Provide a clear and concise description of what the problem is.
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: dropdown
    validations:
      required: true
    attributes:
      label: What add-on are you reporting the bug for?
      description: >
        The `rtl_433 (next)` add-on is the rolling development build.
      options:
        - rtl_433
        - rtl_433 (next)
  - type: input
    attributes:
      label: What is the add-on version?
      description: >
        Shown on the add-on page in Home Assistant. Use `next` for the
        development add-on, and include the rtl_433 version line from the log if
        you have it.
      placeholder: 0.8.1
    validations:
      required: true
  - type: input
    attributes:
      label: What is your Home Assistant version?
      description: >
        Found under Settings -> System -> Repairs -> menu -> System information.
      placeholder: "2026.8.0"
    validations:
      required: true
  - type: input
    attributes:
      label: What SDR hardware are you using?
      description: >
        Include every radio connected to the host if you run more than one.
      placeholder: RTL-SDR Blog V4
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        # Details
  - type: textarea
    attributes:
      label: Add-on log messages
      placeholder: "Copy and paste the add-on log here"
      description: >-
        The log is on the add-on page under Settings -> Apps -> rtl_433 -> Log
        (called Settings -> Add-ons before Home Assistant 2026.2). Turning on
        `log_diagnostic_messages` adds rtl_433's own status and diagnostic
        output, which is usually needed for startup and radio issues.
      render: txt
  - type: textarea
    attributes:
      label: Per-radio config overrides
      description: >-
        If you have any `<id>.conf` override files in the add-on config
        directory (`/addon_configs/rtl433/`, or `/addon_configs/rtl433-next/`
        for the development add-on), paste their contents here.
      render: txt
  - type: textarea
    attributes:
      label: Additional information
      description: >
        If you have any additional information for us, use the field below.
