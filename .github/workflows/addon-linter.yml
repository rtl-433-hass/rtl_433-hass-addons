name: Lint Home Assistant Add-ons

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  addon-linter:
    name: Lint ${{ matrix.addon }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        addon:
          - rtl_433
          - rtl_433-next
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Add-on Linter
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./${{ matrix.addon }}"
